name: macOS CI

on:
  push:
    branches: [main]
    paths: ["macos/**", ".github/workflows/macos-ci.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos-ci.yml"]

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: macos

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          xcodebuild -version
          swiftc --version
      - name: Build
        run: scripts/build-app.sh debug
      - name: HWP engine
        # The pinned rhwp release, checked by SHA-256 the same way the app does it on first use.
        env:
          PICKVERTER_RHWP_DIR: ${{ runner.temp }}/pickverter-rhwp
        run: build/Pickverter.app/Contents/MacOS/Pickverter cli rhwp-install
      - name: Test
        env:
          PICKVERTER_RHWP_DIR: ${{ runner.temp }}/pickverter-rhwp
        run: scripts/test.sh --quick

