name: macOS CI

on:
  push:
    branches: [main]
    paths: ["macos/**", ".github/workflows/macos-ci.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos-ci.yml"]

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: macos

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          xcodebuild -version
          swiftc --version
      - name: Build
        run: scripts/build-app.sh debug
      - name: Test
        run: scripts/test.sh --quick

