name: macOS Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (creates tag v0.2.0)"
        required: true

permissions:
  contents: write

defaults:
  run:
    working-directory: macos

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [ -z "$VERSION" ] && VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          scripts/build-app.sh debug
          scripts/test.sh --quick

      # Optional: a Developer ID certificate keeps privacy permissions across updates and removes the Gatekeeper prompt.
      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Notarization profile
        if: env.APPLE_ID != ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials pickverter --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "PICKVERTER_NOTARY_PROFILE=pickverter" >> "$GITHUB_ENV"

      - name: Build, package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PICKVERTER_UPDATE_KEY: ${{ secrets.PICKVERTER_UPDATE_KEY }}
          PICKVERTER_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          [ -n "$PICKVERTER_SIGN_IDENTITY" ] || unset PICKVERTER_SIGN_IDENTITY
          scripts/release.sh "${{ steps.version.outputs.version }}" --publish

      - name: Keep the artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pickverter-${{ steps.version.outputs.version }}
          path: macos/dist/
          if-no-files-found: ignore

