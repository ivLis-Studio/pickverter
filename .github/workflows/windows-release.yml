name: Windows Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (attaches to release v0.2.0)"
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh
    working-directory: windows

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  PYTHONUTF8: 1

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = "${{ github.ref_name }}" }
          "version=$($version.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Test
        run: |
          python scripts/check-i18n.py
          if ($LASTEXITCODE) { exit 1 }
          dotnet build Pickverter.slnx -c Release
          if ($LASTEXITCODE) { exit 1 }
          dotnet test --project tests/Pickverter.Core.Tests/Pickverter.Core.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE) { exit 1 }

      - name: Build, package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PICKVERTER_UPDATE_KEY: ${{ secrets.PICKVERTER_UPDATE_KEY }}
        run: scripts/release.ps1 -Version "${{ steps.version.outputs.version }}" -Publish

      - name: Keep the artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pickverter-windows-${{ steps.version.outputs.version }}
          path: |
            windows/dist/*/*.exe
            windows/dist/*/*.zip
            windows/dist/*/*.json
            windows/dist/*/*.txt
          if-no-files-found: ignore

